[project]
name = "support-trends-report"
version = "0.1.0"
description = "Weekly 'what's breaking' report for an open-source issue tracker."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
prefect = ["prefect>=3.4"]

[project.scripts]
trends = "trends.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
